<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="footer.css">
    <link rel="stylesheet" href="modal.css">
</head>

<body>
    <main class="catalog">
        <div class="container catalog__conteiner">
            <h1 class="title catalog__title">Выбери свой продукт</h1>
            <button id="change-color-for-all-cards-button">Сменить цвет всех карточек</button>
            <button id="change-color-first-card-button">Сменить цвет первой карточки</button>
            <button id="open-google-button">Открыть страницу Google.com</button>
            <button id="output-console-log-button">Вывести сообщение в консоль лог</button>
            <button class="color-changing-btn">Нажать на кнопку</button>

            
        </div>
    </main>

<!--шаблон для карточек-->
        <ul class="products-list clear-list"></ul>
            <template id="product-card-template">
                <li class="products__item card">
                    <img src="" alt="" class="card__image"/>
                    <span class="card__category"></span>
                    <h2 class="card__name"></h2>

                    <div class="card__description">
                        <p></p>
                    </div>

                    <div class="card__compaund compaund">
                        <span class="card__compaund">Состав:</span>
                        <ul class="compaund__list"></ul>
                    </div>

                    <div class="card__price">
                        <b>Цена:</b>
                        <span></span>
                    </div>
                </li>
            </template>
<!--кнопка регистрации и модальное окно-->
    <button class="button__registration" id="registration-button" type="button">Регистрация</button>
    <div class="modal" id="modal">
        <div class="overlay"></div>
        <div class="modal__content">
            <button class="modal__close" id="modal-close" type="button">&times;</button>
            <h2 class="modal__title">Регистрация</h2>
            <form class="registration__form" id="registration-form" novalidate>
                <label class="registration-form__label" for="first-name">Имя</label>
                <input class="registration-form__input" type="text" id="first-name" name="firstName" placeholder="Введите имя" required>
                <label class="registration-form__label" for="last-name">Фамилия</label>
                <input class="registration-form__input" type="text" id="last-name" name="lastName" placeholder="Введите фамилию" required>
                <label class="registration-form__label" for="birth-date">Дата рождения</label>
                <input class="registration-form__input" type="date" id="birth-date" name="birthDate" required>
                <label class="registration-form__label" for="login">Логин</label>
                <input class="registration-form__input" type="text" id="login" name="login" placeholder="Введите логин" required>
                <label class="registration-form__label" for="password">Пароль</label>
                <input class="registration-form__input" type="password" id="password" name="password" placeholder="Введите пароль" required minlength="6">
                <label class="registration-form__label" for="password-repeat">Повторите пароль</label>
                <input class="registration-form__input" type="password" id="password-repeat" name="passwordRepeat" placeholder="Повторите пароль" required minlength="6">
                <button class="registration-form__button" type="submit">Зарегистрироваться</button>
            </form>
        </div>
    </div>
<!--подвал сайта-->
    <footer class="footer">
        <div class="footer__container">
            <div class="footer__promo">
                <p class="footer__product-cards">Product Cards</p>
                <p class="footer__slogan">У Нас Самые Лучшие Продукты Для Кожи</p>
                <div class="footer__socials">
                    <a href="https://t.me" class="footer__social-link">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M21.5 3.5 2.7 10.8c-1.2.5-1.2 1.2-.2 1.5l4.8 1.5 1.8 5.6c.2.6.4.8.9.8.5 0 .7-.2 1-.5l2.4-2.3 4.9 3.6c.9.5 1.5.2 1.8-.8l3.2-15c.3-1.3-.4-1.9-1.8-1.7z"/>
                        </svg>
                    </a>
                    <a href="https://vk.com" class="footer__social-link">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M13.2 17.4c-6.2 0-9.7-4.2-9.9-11.3h3.1c.1 5.2 2.4 7.4 4.2 7.9V6.1h3v4.5c1.8-.2 3.6-2.2 4.2-4.5h3c-.5 2.8-2.5 4.8-3.9 5.6 1.4.6 3.7 2.4 4.5 5.7h-3.3c-.7-2.2-2.4-3.9-4.5-4.1v4.1h-.4z"/>
                        </svg>
                    </a>
                </div>
            </div>

            <div class="footer__subscribe">
                <p class="footer__subscribe-title">Подпишись на наши акции:</p>
                <form class="form__subscribe" id="form-subscribe" novalidate>
                    <label for="email-subscribe"></label>
                    <input type="email" id="email-subscribe" class="subscribe-form__input"placeholder="Ваш Email..." required>
                    <button type="submit" class="subscribe-form__button">Подписаться</button>
                </form>
            </div>

            <nav class="footer__nav">
                <p class="footer__nav-title">Быстрые ссылки</p>
                <ul class="footer__nav-list">
                    <li><a href="#">Главная</a></li>
                    <li><a href="#">Магазин</a></li>
                    <li><a href="#">Контакты</a></li>
                </ul>
            </nav>

        </div>
<!--линия разделитель-->
        <hr class="footer__line">
<!--копирайт-->
        <p class="footer__copyright">www.product-cards.com©all right reserve</p>
    </footer>
    <script src="main.js"></script>
    <script src="homework-7.js"></script>
    <script src="homework-8.js"></script>
    <script type="module" src="./homework-9.js"></script>
    <script type="module" src="./homework-10.js"></script>
    <script src="homework-11.js"></script>

</body>

</html>
